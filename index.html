<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vishal BG Remover</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(145deg,#071a3d,#1557d6,#071a3d);
    color:white;
    padding:18px;
}

.header{
    max-width:600px;
    margin:auto;
    text-align:center;
    padding:18px 10px;
}

.logo{
    width:58px;
    height:58px;
    margin:auto;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    background:linear-gradient(135deg,#ffffff,#bcd4ff);
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.header h1{
    margin-top:12px;
    font-size:28px;
}

.header p{
    margin-top:7px;
    color:#d9e6ff;
}

.card{
    max-width:600px;
    margin:auto;
    padding:20px;
    border-radius:28px;
    background:rgba(255,255,255,.13);
    border:1px solid rgba(255,255,255,.25);
    backdrop-filter:blur(18px);
    box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.upload{
    border:2px dashed rgba(255,255,255,.55);
    border-radius:22px;
    min-height:190px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    cursor:pointer;
    transition:.25s;
}

.upload:hover{
    background:rgba(255,255,255,.08);
}

.upload .icon{
    font-size:52px;
    margin-bottom:12px;
}

.upload h2{
    font-size:22px;
}

.upload p{
    color:#d5e2ff;
    margin-top:7px;
}

input[type="file"]{
    display:none;
}

.section-title{
    font-size:20px;
    margin:24px 0 12px;
}

.preview{
    width:100%;
    min-height:260px;
    border-radius:20px;
    background:#f4f4f4;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
}

.preview img{
    max-width:100%;
    max-height:420px;
    display:none;
    object-fit:contain;
}

.placeholder{
    color:#777;
    font-size:17px;
}

.btn{
    width:100%;
    border:0;
    border-radius:17px;
    padding:17px;
    margin-top:16px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.remove{
    color:white;
    background:linear-gradient(135deg,#6d5dfc,#3b82f6);
    box-shadow:0 10px 25px rgba(59,130,246,.35);
}

.remove:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.download{
    color:white;
    background:#12a36b;
    display:none;
}

.reset{
    color:white;
    background:#ef4444;
}

.result{
    background:
    linear-gradient(45deg,#ddd 25%,transparent 25%),
    linear-gradient(-45deg,#ddd 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#ddd 75%),
    linear-gradient(-45deg,transparent 75%,#ddd 75%);
    background-size:28px 28px;
    background-position:0 0,0 14px,14px -14px,-14px 0;
}

.progress{
    display:none;
    margin-top:18px;
}

.progress-text{
    text-align:center;
    margin-bottom:8px;
}

.progress-bar{
    width:100%;
    height:9px;
    border-radius:20px;
    background:rgba(255,255,255,.2);
    overflow:hidden;
}

.progress-fill{
    width:0%;
    height:100%;
    background:white;
    transition:.3s;
}

.footer{
    text-align:center;
    color:#cbdcff;
    margin:25px 0 10px;
    font-size:14px;
}

@media(max-width:480px){
    body{
        padding:12px;
    }

    .card{
        padding:16px;
        border-radius:24px;
    }

    .header h1{
        font-size:25px;
    }
}
</style>
</head>

<body>

<div class="header">
    <div class="logo">✂️</div>
    <h1>Vishal BG Remover</h1>
    <p>Professional AI Background Removal</p>
</div>

<div class="card">

    <label class="upload" for="photoInput">
        <div class="icon">📸</div>
        <h2>Upload Photo</h2>
        <p>Tap here to select JPG, PNG or WEBP</p>
    </label>

    <input
        type="file"
        id="photoInput"
        accept="image/png,image/jpeg,image/webp"
    >

    <div class="section-title">Original Image</div>

    <div class="preview">
        <span class="placeholder" id="originalText">
            No image selected
        </span>

        <img id="originalImage">
    </div>

    <button class="btn remove" id="removeBtn" disabled>
        ✨ Remove Background
    </button>

    <div class="progress" id="progress">
        <div class="progress-text" id="progressText">
            Preparing...
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <div class="section-title">
        Result — Transparent Background
    </div>

    <div class="preview result">
        <span class="placeholder" id="resultText">
            Result will appear here
        </span>

        <img id="resultImage">
    </div>

    <button class="btn download" id="downloadBtn">
        ⬇️ Download PNG
    </button>

    <button class="btn reset" id="resetBtn">
        🔄 New Photo
    </button>

</div>

<div class="footer">
    Vishal BG Remover • AI Background Removal
</div>

<script>

const photoInput = document.getElementById("photoInput");
const originalImage = document.getElementById("originalImage");
const resultImage = document.getElementById("resultImage");

const originalText = document.getElementById("originalText");
const resultText = document.getElementById("resultText");

const removeBtn = document.getElementById("removeBtn");
const downloadBtn = document.getElementById("downloadBtn");
const resetBtn = document.getElementById("resetBtn");

const progress = document.getElementById("progress");
const progressFill = document.getElementById("progressFill");
const progressText = document.getElementById("progressText");

let selectedImage = null;
let resultUrl = null;
let isProcessing = false;

// फोटो चुनने पर प्रीव्यू दिखाएँ
photoInput.addEventListener("change", function () {
    const file = this.files[0];

    if (!file) return;

    if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
        alert("कृपया JPG, PNG या WEBP फोटो चुनें।");
        this.value = "";
        return;
    }

    // 10 MB की सीमा
    if (file.size > 10 * 1024 * 1024) {
        alert("कृपया 10 MB से छोटी फोटो चुनें।");
        this.value = "";
        return;
    }

    selectedImage = file;

    // पुराना रिज़ल्ट साफ करें
    if (resultUrl) {
        URL.revokeObjectURL(resultUrl);
        resultUrl = null;
    }

    resultImage.removeAttribute("src");
    resultImage.style.display = "none";
    resultText.style.display = "block";
    resultText.innerText = "Result will appear here";
    downloadBtn.style.display = "none";

    progress.style.display = "none";
    progressFill.style.width = "0%";

    // तुरंत Original Image प्रीव्यू
    const previewUrl = URL.createObjectURL(file);

    originalImage.onload = function () {
        originalImage.style.display = "block";
        originalText.style.display = "none";
        URL.revokeObjectURL(previewUrl);
    };

    originalImage.onerror = function () {
        URL.revokeObjectURL(previewUrl);
        originalImage.style.display = "none";
        originalText.style.display = "block";
        originalText.innerText = "Photo could not be loaded";
    };

    originalImage.src = previewUrl;

    removeBtn.disabled = false;
});

// Remove Background
removeBtn.addEventListener("click", async function () {
    if (!selectedImage || isProcessing) {
        if (!selectedImage) alert("पहले फोटो चुनें।");
        return;
    }

    isProcessing = true;
    removeBtn.disabled = true;
    downloadBtn.style.display = "none";

    progress.style.display = "block";
    progressFill.style.width = "10%";
    progressText.innerText = "फोटो तैयार हो रही है...";

    try {
        // फोटो को Base64 Data URL में बदलें
        const imageBase64 = await new Promise((resolve, reject) => {
            const reader = new FileReader();

            reader.onload = () => resolve(reader.result);
            reader.onerror = () => reject(
                new Error("फोटो पढ़ी नहीं जा सकी।")
            );

            reader.readAsDataURL(selectedImage);
        });

        progressFill.style.width = "30%";
        progressText.innerText = "AI सर्वर पर फोटो भेजी जा रही है...";

        // Backend को POST रिक्वेस्ट
        const response = await fetch("/api/remove", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                imageBase64: imageBase64
            })
        });

        progressFill.style.width = "75%";
        progressText.innerText = "AI फोटो प्रोसेस कर रहा है...";

        // Backend की त्रुटि को पढ़ें
        if (!response.ok) {
            let errorMessage = "Background removal असफल रहा।";

            const contentType = response.headers.get("content-type") || "";

            if (contentType.includes("application/json")) {
                const errorData = await response.json();
                errorMessage = errorData.error || errorData.message || errorMessage;
            } else {
                const errorText = await response.text();
                if (errorText) {
                    errorMessage = errorText.slice(0, 250);
                }
            }

            throw new Error(errorMessage);
        }

        // Backend से PNG Blob प्राप्त करें
        const pngBlob = await response.blob();

        if (!pngBlob.size) {
            throw new Error("Backend से खाली रिज़ल्ट मिला।");
        }

        if (
            pngBlob.type &&
            !pngBlob.type.includes("image/png") &&
            !pngBlob.type.includes("application/octet-stream")
        ) {
            throw new Error("Backend ने PNG इमेज नहीं भेजी।");
        }

        progressFill.style.width = "95%";
        progressText.innerText = "रिज़ल्ट तैयार हो रहा है...";

        // पुराना URL हटाएँ
        if (resultUrl) {
            URL.revokeObjectURL(resultUrl);
        }

        resultUrl = URL.createObjectURL(pngBlob);

        // रिज़ल्ट बॉक्स में PNG दिखाएँ
        resultImage.onload = function () {
            resultImage.style.display = "block";
            resultText.style.display = "none";

            progressFill.style.width = "100%";
            progressText.innerText = "Background सफलतापूर्वक हट गया!";

            downloadBtn.style.display = "block";
            isProcessing = false;
            removeBtn.disabled = false;
        };

        resultImage.onerror = function () {
            if (resultUrl) {
                URL.revokeObjectURL(resultUrl);
                resultUrl = null;
            }

            throw new Error("प्राप्त रिज़ल्ट इमेज खुल नहीं पाई।");
        };

        resultImage.src = resultUrl;

    } catch (error) {
        console.error("Background removal error:", error);

        progressFill.style.width = "100%";
        progressText.innerText = "प्रोसेस पूरा नहीं हुआ";

        alert("त्रुटि: " + error.message);

        isProcessing = false;
        removeBtn.disabled = !selectedImage;
    }
});

// PNG डाउनलोड
downloadBtn.addEventListener("click", function () {
    if (!resultUrl) {
        alert("पहले Background Remove करें।");
        return;
    }

    const link = document.createElement("a");
    link.href = resultUrl;
    link.download = "vishal-bg-removed.png";

    document.body.appendChild(link);
    link.click();
    link.remove();
});

// Reset / नई फोटो
resetBtn.addEventListener("click", function () {
    if (isProcessing) return;

    photoInput.value = "";
    selectedImage = null;

    if (resultUrl) {
        URL.revokeObjectURL(resultUrl);
        resultUrl = null;
    }

    originalImage.removeAttribute("src");
    resultImage.removeAttribute("src");

    originalImage.style.display = "none";
    resultImage.style.display = "none";

    originalText.style.display = "block";
    originalText.innerText = "No image selected";

    resultText.style.display = "block";
    resultText.innerText = "Result will appear here";

    removeBtn.disabled = true;
    downloadBtn.style.display = "none";

    progress.style.display = "none";
    progressFill.style.width = "0%";
    progressText.innerText = "Preparing...";
});


</script>

</body>
</html>
